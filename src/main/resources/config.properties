# ============================================================
#  photogear.app – Configuración de base de datos
#
#  Perfil activo: cambia 'db.profile' a 'mariadb' para producción
#  O usa la propiedad JVM: -Ddb.profile=mariadb
#  (en Tomcat: agrega a setenv.sh → JAVA_OPTS="$JAVA_OPTS -Ddb.profile=mariadb")
# ============================================================

db.profile=h2

# ── H2 (desarrollo / pruebas) ────────────────────────────────
h2.driver=org.h2.Driver
h2.url=jdbc:h2:~/photogear_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
h2.username=sa
h2.password=

# ── MariaDB (producción) ─────────────────────────────────────
mariadb.driver=org.mariadb.jdbc.Driver
mariadb.url=jdbc:mariadb://localhost:3306/photogear?characterEncoding=UTF-8&serverTimezone=America/Mexico_City&useSSL=false
mariadb.username=photogear_user
mariadb.password=CAMBIA_ESTA_CONTRASENA

# ── HikariCP – pool de conexiones ────────────────────────────
hikari.minimum-idle=2
hikari.maximum-pool-size=10
hikari.connection-timeout=30000
hikari.idle-timeout=600000
hikari.max-lifetime=1800000

# ── CORS ─────────────────────────────────────────────────────
# Orígenes permitidos. En producción pon tu dominio real:
#   -Dcors.allowed.origins=https://tuapp.com
# o edita esta línea. Prioridad: JVM property > aquí > web.xml init-param
cors.allowed.origins=*

# ── Google OAuth 2.0 ─────────────────────────────────────────
# Obtén tu Client ID en: https://console.cloud.google.com/apis/credentials
# 1. Crea un proyecto → Credenciales → Crear credenciales → ID de cliente OAuth 2.0
# 2. Tipo de aplicación: Aplicación web
# 3. Orígenes autorizados: http://localhost:8080  (o tu dominio)
# 4. URI de redireccionamiento: no aplica (usamos el flujo de ID Token del lado del cliente)
google.client.id=TU_CLIENT_ID.apps.googleusercontent.com

# ── JWT ──────────────────────────────────────────────────────
# Clave secreta para firmar los tokens (mín. 32 caracteres, usa caracteres aleatorios)
jwt.secret=CAMBIA_ESTO_POR_UNA_CLAVE_SECRETA_LARGA_Y_ALEATORIA_32+
jwt.expiry.hours=24
